<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PENSO & ANDRA - Painel de Controle de Mesas</title>
  
  <!-- ÍCONE DA ABA DO NAVEGADOR (FAVICON) -->
 <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1675MjUpnQr8081zxfjqLuQjDxFrisK1Z&sz=w128">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0d1e17 0%, #05080a 70%);
      --card-bg: rgba(13, 22, 20, 0.85);
      --card-border: rgba(0, 255, 135, 0.18);
      --primary-green: #00FF87;
      --primary-glow: rgba(0, 255, 135, 0.25);
      --status-done: #00FF87;
      --status-pending: #FF4B4B;
      --status-in-progress: #FFB800;
      --text-main: #FFFFFF;
      --text-muted: #8E9BAE;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px;
    }

    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 135, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 135, 0.03) 1px, transparent 1px);
      background-size: 40px 40px; z-index: -1; pointer-events: none;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 30px; background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(20px); border-radius: 20px; margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-wrap: wrap; gap: 15px;
    }

    .brand-section { display: flex; align-items: center; gap: 15px; }
    .brand-logo {
      font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(135deg, #FFF 0%, var(--primary-green) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge-client {
      background: rgba(0, 255, 135, 0.1); border: 1px solid var(--primary-green);
      color: var(--primary-green); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
    }
    .user-info { text-align: right; }
    .user-name { font-weight: 700; font-size: 0.95rem; color: #FFF; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .nav-tabs { display: flex; gap: 12px; margin-bottom: 25px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    .tab-btn {
      background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 10px 22px; border-radius: 12px; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--primary-green); color: #000; border-color: var(--primary-green);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .kpi-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 22px; border-radius: 16px; backdrop-filter: blur(10px);
    }
    .kpi-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .kpi-value { font-size: 2.2rem; font-weight: 800; margin-top: 8px; }

    .charts-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 30px; }
    .chart-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 24px; border-radius: 20px; backdrop-filter: blur(10px); height: 320px;
    }
    .chart-title { font-size: 1rem; font-weight: 700; margin-bottom: 15px; color: #FFF; }

    .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-filter {
      background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 8px 16px; border-radius: 10px;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    .btn-filter.active { background: var(--primary-green); color: #000; border-color: var(--primary-green); }

    .btn-export {
      background: linear-gradient(135deg, var(--primary-green), #00cc6a);
      color: #000; font-weight: 700; border: none; padding: 10px 20px; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem; transition: 0.3s; box-shadow: 0 0 15px var(--primary-glow);
    }

    .mesas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .mesa-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 20px; transition: all 0.3s ease; backdrop-filter: blur(10px);
    }
    .mesa-card:hover { transform: translateY(-4px); border-color: var(--primary-green); box-shadow: 0 10px 25px rgba(0, 255, 135, 0.15); }

    .mesa-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .mesa-number { font-size: 1.1rem; font-weight: 800; color: #FFF; }
    .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; }
    .status-done { background: rgba(0, 255, 135, 0.15); color: var(--status-done); border: 1px solid var(--status-done); }
    .status-pending { background: rgba(255, 75, 75, 0.15); color: var(--status-pending); border: 1px solid var(--status-pending); }
    .status-progress { background: rgba(255, 184, 0, 0.15); color: var(--status-in-progress); border: 1px solid var(--status-in-progress); }

    .img-container {
      width: 100%; height: 130px; background: rgba(0,0,0,0.3); border-radius: 10px;
      margin: 10px 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
      border: 1px dashed rgba(255,255,255,0.1); position: relative; cursor: pointer;
    }
    .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .img-container:hover img { transform: scale(1.05); }
    .img-placeholder { color: var(--text-muted); font-size: 0.75rem; text-align: center; cursor: default; }

    .card-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    select, input[type="text"] {
      width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border);
      color: #FFF; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; outline: none;
    }
    select:focus, input:focus { border-color: var(--primary-green); }

    .btn-save {
      background: linear-gradient(135deg, var(--primary-green), #00cc6a);
      color: #000; font-weight: 700; border: none; padding: 10px; border-radius: 8px;
      cursor: pointer; font-size: 0.8rem; transition: 0.2s;
    }

    .galeria-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .galeria-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; overflow: hidden; backdrop-filter: blur(10px); cursor: pointer;
      transition: transform 0.3s;
    }
    .galeria-card:hover { transform: translateY(-4px); border-color: var(--primary-green); }
    .galeria-card img { width: 100%; height: 160px; object-fit: cover; }
    .galeria-info { padding: 15px; }

    .lightbox-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999;
      justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    .lightbox-modal.active { display: flex; }
    .lightbox-img { max-width: 90vw; max-height: 80vh; border-radius: 12px; border: 2px solid var(--primary-green); box-shadow: 0 0 30px var(--primary-glow); object-fit: contain; }
    .lightbox-caption { margin-top: 15px; font-size: 1.1rem; color: #FFF; font-weight: 700; text-align: center; }
    .lightbox-close {
      position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: var(--primary-green);
      cursor: pointer; font-weight: 800; transition: transform 0.2s;
    }
    .lightbox-close:hover { transform: scale(1.2); }

    @media (max-width: 900px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-section">
        <div class="brand-logo">PENSO</div>
        <span class="badge-client">CLIENTE: ANDRA</span>
      </div>
      <div class="user-info">
        <div class="user-name">Klayton Ruan dos Santos Duarte</div>
        <div class="user-role">Analista de Suporte T.I.</div>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-tab-mesas">🖥️ Gerenciador de Mesas</button>
      <button class="tab-btn" id="btn-tab-galeria">🖼️ Galeria de Evidências</button>
    </div>

    <div id="tab-mesas" class="tab-content active">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Total de Mesas</div>
          <div class="kpi-value" style="color: #FFF;">32</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Concluídas</div>
          <div class="kpi-value" style="color: var(--status-done);" id="kpi-concluidas">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Em Atendimento</div>
          <div class="kpi-value" style="color: var(--status-in-progress);" id="kpi-progress">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Pendentes</div>
          <div class="kpi-value" style="color: var(--status-pending);" id="kpi-pendentes">0</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-title">Status Geral</div>
          <div style="height: 220px; position: relative;">
            <canvas id="chartDonut"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Progresso por Blocos de Mesas</div>
          <div style="height: 220px; position: relative;">
            <canvas id="chartBar"></canvas>
          </div>
        </div>
      </div>

      <div class="controls-bar">
        <div class="filter-group">
          <button class="btn-filter active" id="filter-todos">Todas as Mesas</button>
          <button class="btn-filter" id="filter-pendente">🔴 Pendentes</button>
          <button class="btn-filter" id="filter-atendimento">🟡 Em Atendimento</button>
          <button class="btn-filter" id="filter-concluida">🟢 Concluídas</button>
        </div>

        <button class="btn-export" id="btn-export-csv">📥 Exportar Relatório CSV</button>
      </div>

      <div class="mesas-grid" id="gridMesas"></div>
    </div>

    <div id="tab-galeria" class="tab-content">
      <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--primary-green);">📸 Evidências Fotográficas dos Atendimentos</h2>
      <div class="galeria-grid" id="gridGaleria"></div>
    </div>

  </div>

  <div class="lightbox-modal" id="lightboxModal">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Zoom Evidência">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzF-R5-5ctBFX57B9pcrC5SimPoQ2nbm37iy6dAow_6LWep4PdtK0XTi8yNgU5bhTlQ/exec";

    let dadosMesas = [];
    let filtroAtual = 'todos';
    let donutChart = null;
    let barChart = null;

    function formatarUrlImagem(url) {
      if (!url) return '';
      let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
      }
      return url;
    }

    function abrirLightbox(url, titulo) {
      if (!url) return;
      const modal = document.getElementById('lightboxModal');
      const img = document.getElementById('lightboxImg');
      const caption = document.getElementById('lightboxCaption');
      
      img.src = url;
      caption.innerText = titulo;
      modal.classList.add('active');
    }

    function fecharLightbox() {
      document.getElementById('lightboxModal').classList.remove('active');
    }

    function carregarDadosPlanilha() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data) && data.length > 0) {
            dadosMesas = data;
            render();
          }
        })
        .catch(err => console.error("Erro ao carregar dados:", err));
    }

    function render() {
      atualizarKPIs();
      renderGrid();
      renderCharts();
      renderGaleria();
    }

    function atualizarKPIs() {
      let c = 0, p = 0, a = 0;
      dadosMesas.forEach(m => {
        if (m.status === 'Concluída') c++;
        else if (m.status === 'Em Atendimento') a++;
        else p++;
      });
      document.getElementById('kpi-concluidas').innerText = c;
      document.getElementById('kpi-progress').innerText = a;
      document.getElementById('kpi-pendentes').innerText = p;
    }

    function renderGrid() {
      const grid = document.getElementById('gridMesas');
      grid.innerHTML = '';

      dadosMesas.forEach((m, idx) => {
        const num = idx + 1;
        if (filtroAtual !== 'todos' && m.status !== filtroAtual) return;

        let badgeClass = 'status-pending';
        if (m.status === 'Concluída') badgeClass = 'status-done';
        if (m.status === 'Em Atendimento') badgeClass = 'status-progress';

        const imgUrl = formatarUrlImagem(m.foto);

        const card = document.createElement('div');
        card.className = 'mesa-card';
        card.innerHTML = `
          <div class="mesa-header">
            <span class="mesa-number">${m.mesa}</span>
            <span class="status-badge ${badgeClass}">${m.status}</span>
          </div>
          
          <div class="img-container" id="img-preview-${num}">
            ${imgUrl ? `<img src="${imgUrl}" alt="Foto ${m.mesa}">` : `<div class="img-placeholder">📷 Nenhuma imagem<br>anexada</div>`}
          </div>

          <div class="card-actions">
            <select id="status-${num}">
              <option value="Pendente" ${m.status === 'Pendente' ? 'selected' : ''}>🔴 Pendente</option>
              <option value="Em Atendimento" ${m.status === 'Em Atendimento' ? 'selected' : ''}>🟡 Em Atendimento</option>
              <option value="Concluída" ${m.status === 'Concluída' ? 'selected' : ''}>🟢 Concluída</option>
            </select>

            <input type="text" id="foto-${num}" placeholder="Link da Foto" value="${m.foto || ''}">
            <input type="text" id="obs-${num}" placeholder="Observação / Chamado" value="${m.observacao || ''}">

            <button class="btn-save" id="btn-save-${num}">Salvar Alterações</button>
          </div>
        `;

        grid.appendChild(card);

        const containerImg = document.getElementById(`img-preview-${num}`);
        if (imgUrl) {
          containerImg.addEventListener('click', () => abrirLightbox(imgUrl, `${m.mesa} - Evidência de Atendimento`));
        }

        document.getElementById(`btn-save-${num}`).addEventListener('click', () => salvarMesa(num));
      });
    }

    function salvarMesa(num) {
      const btn = document.getElementById(`btn-save-${num}`);
      btn.innerText = 'Salvando...';

      const st = document.getElementById(`status-${num}`).value;
      const ft = document.getElementById(`foto-${num}`).value;
      const ob = document.getElementById(`obs-${num}`).value;

      dadosMesas[num - 1].status = st;
      dadosMesas[num - 1].foto = ft;
      dadosMesas[num - 1].observacao = ob;

      const payload = {
        numeroMesa: num,
        status: st,
        foto: ft,
        observacao: ob
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.innerText = 'Salvar Alterações';
        render();
      })
      .catch(err => {
        btn.innerText = 'Salvar Alterações';
        console.error("Erro ao salvar:", err);
      });
    }

    function renderGaleria() {
      const galeria = document.getElementById('gridGaleria');
      galeria.innerHTML = '';

      const fotos = dadosMesas.filter(m => m.foto && m.foto.trim() !== '');

      if (fotos.length === 0) {
        galeria.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">Nenhuma foto anexada até o momento.</div>';
        return;
      }

      fotos.forEach(m => {
        const imgUrl = formatarUrlImagem(m.foto);
        const card = document.createElement('div');
        card.className = 'galeria-card';
        card.innerHTML = `
          <img src="${imgUrl}" alt="Evidência ${m.mesa}">
          <div class="galeria-info">
            <strong style="color: var(--primary-green); display: block; margin-bottom: 5px;">${m.mesa}</strong>
            <div style="font-size: 0.8rem; color: var(--text-muted);">${m.observacao || 'Sem observações'}</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-top: 5px;">Status: ${m.status}</div>
          </div>
        `;
        card.addEventListener('click', () => abrirLightbox(imgUrl, `${m.mesa} - Evidência de Atendimento`));
        galeria.appendChild(card);
      });
    }

    function exportarRelatorioCSV() {
      let csv = 'Mesa;Status;Observacao;UltimaAtualizacao\n';
      dadosMesas.forEach(m => {
        csv += `${m.mesa};${m.status};${m.observacao || ''};${m.ultimaAtualizacao || ''}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Relatorio_Andra_${new Date().toLocaleDateString('pt-BR')}.csv`;
      link.click();
    }

    function renderCharts() {
      let c = 0, p = 0, a = 0;
      dadosMesas.forEach(m => {
        if (m.status === 'Concluída') c++;
        else if (m.status === 'Em Atendimento') a++;
        else p++;
      });

      if (donutChart) donutChart.destroy();
      if (barChart) barChart.destroy();

      const ctxD = document.getElementById('chartDonut').getContext('2d');
      donutChart = new Chart(ctxD, {
        type: 'doughnut',
        data: {
          labels: ['Concluídas', 'Em Atendimento', 'Pendentes'],
          datasets: [{ data: [c, a, p], backgroundColor: ['#00FF87', '#FFB800', '#FF4B4B'], borderWidth: 0 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#8E9BAE', font: { family: 'Plus Jakarta Sans' } } } },
          cutout: '70%'
        }
      });

      const blocos = [0, 0, 0, 0];
      dadosMesas.forEach((m, idx) => {
        if (m.status === 'Concluída') {
          const bIdx = Math.floor(idx / 8);
          if (bIdx < 4) blocos[bIdx]++;
        }
      });

      const ctxB = document.getElementById('chartBar').getContext('2d');
      barChart = new Chart(ctxB, {
        type: 'bar',
        data: {
          labels: ['Mesas 1-8', 'Mesas 9-16', 'Mesas 17-24', 'Mesas 25-32'],
          datasets: [{ label: 'Concluídas', data: blocos, backgroundColor: '#00FF87', borderRadius: 8 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            y: { ticks: { color: '#8E9BAE' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            x: { ticks: { color: '#8E9BAE' }, grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      carregarDadosPlanilha();

      document.getElementById('btn-tab-mesas').addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('tab-mesas').classList.add('active');
      });

      document.getElementById('btn-tab-galeria').addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('tab-galeria').classList.add('active');
      });

      const setFiltro = (st, btn) => {
        filtroAtual = st;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
      };

      document.getElementById('filter-todos').addEventListener('click', function() { setFiltro('todos', this); });
      document.getElementById('filter-pendente').addEventListener('click', function() { setFiltro('Pendente', this); });
      document.getElementById('filter-atendimento').addEventListener('click', function() { setFiltro('Em Atendimento', this); });
      document.getElementById('filter-concluida').addEventListener('click', function() { setFiltro('Concluída', this); });

      document.getElementById('btn-export-csv').addEventListener('click', exportarRelatorioCSV);

      document.getElementById('lightboxClose').addEventListener('click', fecharLightbox);
      document.getElementById('lightboxModal').addEventListener('click', (e) => {
        if (e.target.id === 'lightboxModal') fecharLightbox();
      });
    });
  </script>
</body>
</html>
